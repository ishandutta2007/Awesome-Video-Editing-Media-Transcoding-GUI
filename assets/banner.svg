<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#06b6d4;#6366f1" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#ec4899;#a855f7" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#a855f7;#06b6d4" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-violet" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .code-pill {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1280" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="80" r="260" fill="url(#glow-cyan)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="280" r="280" fill="url(#glow-violet)">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Outer Border Stroke -->
  <rect width="1278" height="358" x="1" y="1" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" rx="15" />

  <!-- ================= DYNAMIC BACKGROUND GRAPHICS ================= -->

  <!-- Transcoding / Waveform Visualizer Layer (Lower third, low opacity so text shines) -->
  <g opacity="0.38" transform="translate(60, 248)">
    <!-- Video Timeline Track Background -->
    <rect x="0" y="0" width="1160" height="64" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Video Track Clips -->
    <rect x="15" y="8" width="190" height="48" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.85" />
    <text x="30" y="36" class="code-pill">PRORES_422.MOV</text>

    <rect x="215" y="8" width="280" height="48" rx="6" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1" opacity="0.85" />
    <text x="230" y="36" class="code-pill">NVENC_AV1_10BIT.MKV</text>

    <rect x="505" y="8" width="220" height="48" rx="6" fill="#4c1d95" stroke="#a855f7" stroke-width="1" opacity="0.85" />
    <text x="520" y="36" class="code-pill">LOSSLESS_CUT.MP4</text>

    <rect x="735" y="8" width="180" height="48" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.85" />
    <text x="750" y="36" class="code-pill">SUBTITLES.SRT</text>

    <rect x="925" y="8" width="220" height="48" rx="6" fill="#701a75" stroke="#d946ef" stroke-width="1" opacity="0.85" />
    <text x="940" y="36" class="code-pill">REMUX_WEBM_H265</text>

    <!-- Animated Scanning Playhead -->
    <line x1="20" y1="-6" x2="20" y2="70" stroke="#f43f5e" stroke-width="2.5" filter="url(#glow-filter)">
      <animate attributeName="x1" values="20;1140;20" dur="14s" repeatCount="indefinite" />
      <animate attributeName="x2" values="20;1140;20" dur="14s" repeatCount="indefinite" />
    </line>
    <polygon points="14,-6 26,-6 20,4" fill="#f43f5e">
      <animate attributeName="transform" type="translate" values="0,0; 1120,0; 0,0" dur="14s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Pulsing Audio Waveform Bars (Decorative, Right Side) -->
  <g transform="translate(1010, 85)" opacity="0.45">
    <rect x="0" y="20" width="4" height="28" fill="#38bdf8" rx="2">
      <animate attributeName="height" values="28;50;15;42;28" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;9;26;13;20" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="9" y="15" width="4" height="38" fill="#818cf8" rx="2">
      <animate attributeName="height" values="38;18;54;24;38" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="15;25;7;22;15" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="10" width="4" height="48" fill="#c084fc" rx="2">
      <animate attributeName="height" values="48;62;20;56;48" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;3;24;6;10" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="27" y="24" width="4" height="20" fill="#f472b6" rx="2">
      <animate attributeName="height" values="20;46;12;38;20" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="24;11;28;15;24" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="36" y="8" width="4" height="52" fill="#38bdf8" rx="2">
      <animate attributeName="height" values="52;24;58;18;52" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="8;22;5;25;8" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <rect x="45" y="18" width="4" height="32" fill="#818cf8" rx="2">
      <animate attributeName="height" values="32;55;20;48;32" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="18;6.5;24;10;18" dur="2.3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (UNOBSTRUCTED) ================= -->

  <!-- Top Category Badge Pill -->
  <g transform="translate(60, 48)">
    <rect width="295" height="30" rx="15" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="29" y="19" class="badge-text">VIDEO EDITING &amp; TRANSCODING</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" class="title-text" font-size="38" filter="url(#shadow)">
    Awesome Video Editing &amp;
  </text>
  <text x="60" y="178" class="title-text" font-size="38" fill="url(#accent-grad)" filter="url(#shadow)">
    Media Transcoding GUI
  </text>

  <!-- Subtitle -->
  <text x="60" y="218" class="subtitle-text" font-size="15.5">
    Curated FFmpeg Frontends • Batch Transcoders • Lossless Cutters • Cloud &amp; Desktop NLEs
  </text>

  <!-- Hardware Tech Tags Pill Box (Right Foreground) -->
  <g transform="translate(730, 48)">
    <!-- Pill 1: FFmpeg -->
    <rect x="0" y="0" width="85" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="17" y="18" class="code-pill">FFmpeg</text>

    <!-- Pill 2: AV1 / HEVC -->
    <rect x="95" y="0" width="105" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="110" y="18" class="code-pill">AV1 • HEVC</text>

    <!-- Pill 3: NVENC / QSV -->
    <rect x="210" y="0" width="115" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="223" y="18" class="code-pill">GPU Accel</text>

    <!-- Pill 4: Lossless -->
    <rect x="335" y="0" width="95" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="350" y="18" class="code-pill">Lossless</text>

    <!-- Pill 5: WebAssembly -->
    <rect x="440" y="0" width="90" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="454" y="18" class="code-pill">Wasm</text>
  </g>
</svg>
